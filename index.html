<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bir Öğrenciye Destek Ol</title>
    <style>
        /* Genel Sayfa Ayarları */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f9fc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Video Kapsayıcısı ve Küçülme Animasyonu */
        .video-container {
            width: 90%;
            max-width: 380px;
            aspect-ratio: 9/16;
            margin-top: 30px;
            transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

            .video-container.shrink {
                max-width: 220px;
                margin-top: 20px;
                opacity: 0.8;
            }

        iframe {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border: none;
        }

        /* Metin Kapsayıcısı Ayarları */
        .message-container {
            max-width: 500px;
            width: 90%;
            background: white;
            padding: 35px 25px;
            margin: 30px 0 50px 0;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            text-align: center;
            display: none;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease, transform 1s ease;
        }

            .message-container.show {
                display: block;
            }

            .message-container.fade-in {
                opacity: 1;
                transform: translateY(0);
            }

            .message-container p {
                font-size: 1.1rem;
                line-height: 1.6;
                color: #333;
                margin-bottom: 20px;
            }

        .highlight-text {
            font-weight: 600;
            color: #2c3e50;
        }

        .email-btn {
            display: inline-block;
            margin: 10px 0;
            padding: 14px 28px;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.05rem;
            box-shadow: 0 4px 15px rgba(0, 86, 179, 0.3);
            transition: background-color 0.3s, transform 0.2s;
        }

            .email-btn:hover {
                background-color: #004494;
                transform: translateY(-2px);
            }

        .footer-note {
            margin-top: 25px;
            font-size: 0.95rem !important;
            color: #7f8c8d !important;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Video Alanı: iframe artık doğrudan HTML içinde. enablejsapi=1 parametresi çok önemli -->
    <div class="video-container" id="videoWrapper">
        <iframe id="player"
                src="https://www.youtube.com/embed/AhruZ9xavfQ?enablejsapi=1&rel=0&playsinline=1"
                allow="autoplay; encrypted-media"
                allowfullscreen>
        </iframe>
    </div>

    <!-- Video Bitince Çıkacak Mesaj Alanı -->
    <div class="message-container" id="messageBox">
        <p class="highlight-text">Merhaba, siz de bu videoda bahsedilen kişi gibi güzel sevap kazanmak ve bir öğrenciyi mutlu etmek ister misiniz ?</p>
        <p>Eğer isterseniz,<br>Detayları konuşmak ve iletişime geçmek için bana mail atabilirsiniz.</p>

        <a href="mailto:mehmetulusiletisim@gmail.com" class="email-btn">mehmetulusiletisim@gmail.com</a>

        <p class="footer-note">Öğrencimizle ilgili bilgi vereceğim sizlere.</p>
    </div>

    <script>
        // YouTube API'sini yüklüyoruz
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;

        // API hazır olduğunda mevcut iframe'e bağlanıyoruz
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            // Video bittiğinde (Durum 0)
            if (event.data === YT.PlayerState.ENDED) {
                triggerPostVideoActions();
            }
        }

        function triggerPostVideoActions() {
            const videoWrapper = document.getElementById('videoWrapper');
            const messageBox = document.getElementById('messageBox');

            videoWrapper.classList.add('shrink');
            messageBox.classList.add('show');

            setTimeout(() => {
                messageBox.classList.add('fade-in');
                messageBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 150);
        }
    </script>
</body>
</html>
